# The BlueBuild default-flatpaks timer fires once, 30s after boot. On the first
# boot after the installer there may be no network yet (Wi-Fi is only set up
# during gnome-initial-setup), so the single run fails with "Could not resolve
# hostname" and the Flatpaks only arrive on the next boot. Retry instead.
[Unit]
StartLimitIntervalSec=1h
StartLimitBurst=20

[Service]
Restart=on-failure
RestartSec=60
