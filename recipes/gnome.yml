---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Install GSConnect comes from Fedora's packages: the gnome-extensions module can't
  # install it (it hard-codes paths that aren't writable at build time)
  - type: dnf
    install:
      packages:
        - gnome-shell-extension-gsconnect
        - nautilus-gsconnect
    # Silverblue ships with GNOME. Remove bundled apps we don't want
    remove:
      packages:
        - gnome-software
        - yelp
        - malcontent-control
        - gnome-tour
        - gnome-user-docs
        - gnome-user-share
        - gnome-remote-desktop
        - rygel
        - gnome-classic-session
        - gnome-system-monitor
  # Install GNOME Flatpaks that we want from Flathub (what Silverblue's installer preinstalls from Fedora's remote)
  # No GNOME Flatpak will be installed otherwise, as Fedora Flatpak remote is masked
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          name: flathub
          title: Flathub
        install:
          - org.gnome.baobab # Disk Usage Analyzer
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Decibels
          - org.gnome.Contacts
          - org.gnome.font-viewer
          - org.gnome.TextEditor
          - org.gnome.Loupe # Image viewer
          - org.gnome.Logs
          - org.gnome.NautilusPreviewer
          - org.gnome.Papers
          - org.gnome.Showtime
  # Install GNOME extensions (https://extensions.gnome.org)
  - type: gnome-extensions
    install:
      - "3193" # Blur my Shell
      - "615" # AppIndicator and KStatusNotifierItem Support
      - "2236" # Night Theme Switcher
      - "6670" # Bluetooth Battery Meter
      - "517" # Caffeine
  # Uninstall default GNOME extensions that come with Silverblue
    uninstall:
      - "6" # Apps Menu
      - "7364" # Background Logo
      - "600" # Launch New Instance
      - "8" # Places Status Indicator
      - "602" # Window List; refer by ID as name alone also matches another extension
  # Enable all of the extensions (including GSConnect) by default
  - type: gschema-overrides
    include:
      - zz1-extensions.gschema.override
