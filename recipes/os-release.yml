---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
#
# Brand the OS in /etc/os-release (shown e.g. in Settings > About).
# ID is left as "fedora" on purpose: changing it can break tools that
# identify the distribution.
type: os-release
properties:
  NAME: NikOS
  PRETTY_NAME: NikOS (Fedora Silverblue)
  HOME_URL: https://github.com/nikokultalahti/nikos
  DOCUMENTATION_URL: https://github.com/nikokultalahti/nikos
  SUPPORT_URL: https://github.com/nikokultalahti/nikos/issues
  BUG_REPORT_URL: https://github.com/nikokultalahti/nikos/issues
