---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: nikos
description: NikOS, a custom Fedora Silverblue image with a trimmed GNOME, Homebrew and Flathub apps.

base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: "44"

# Order matters: modules run top to bottom, each as a cached layer.
# Rarely changed pieces come first, frequently edited ones last.
modules:
  - from-file: gnome.yml
  - from-file: packages.yml
  - from-file: dev.yml
  - from-file: homebrew.yml
  - from-file: flatpaks.yml
  - from-file: system.yml
  - from-file: os-release.yml

  # Set up signing for secure image verification
  - type: signing
